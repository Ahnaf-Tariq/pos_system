<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — open once online</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0a0a0a;
        color: #fafafa;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        text-align: center;
        border: 1px solid #27272a;
        border-radius: 0.75rem;
        padding: 2rem;
        background: #18181b;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0;
        color: #a1a1aa;
        line-height: 1.5;
        font-size: 0.9375rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Offline Cache Empty</h1>
      <p>This page hasn't been cached yet.</p>
      <p>
        Press <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> to solve this
        problem.
      </p>
    </div>
  </body>
</html>
